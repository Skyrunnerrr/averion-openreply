name: openreply-averion-p2b
# Deployment topology for the OpenReply provider profile.
# Public internet reaches only public-edge. That process proxies PUBLIC_REQUIRED
# requests to web:3000 and refuses everything else. web has no host port.
# Postgres, Redis, the worker, and cron are on the internal network only.

services:
  public-edge:
    image: docker.io/library/node@sha256:3d0f05455dea2c82e2f76e7e2543964c30f6b7d673fc1a83286736d44fe4c41c
    command: ["node", "/config/ingress-edge.mjs"]
    environment:
      INGRESS_LISTENER: public
      INGRESS_BIND: 0.0.0.0
      INGRESS_PORT: "8080"
      OPENREPLY_UPSTREAM_URL: http://web:3000
    ports:
      - "8080:8080"
    volumes:
      - ./ingress-edge.mjs:/config/ingress-edge.mjs:ro
      - ./ingress-policy.json:/config/ingress-policy.json:ro
    depends_on:
      web:
        condition: service_started
    networks: [edge]
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres@sha256:a85daf0dbd5e79586e850e3fe4b21b796799828ad015ce2166aeb98cc24da61c
    environment:
      POSTGRES_DB: openreply
      POSTGRES_USER: openreply
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openreply -d openreply"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: docker.io/library/redis@sha256:ca0acbb137c1dc3339c8b147a58fd6f42775d4599327b50e7b116c23de501af2
    command:
      - sh
      - -c
      - redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    networks: [internal]
    restart: unless-stopped

  web:
    image: ${OPENREPLY_IMAGE_REF:?set to the digest produced from the release candidate}
    env_file:
      - path: ./secrets.env
        required: false
    environment:
      NODE_ENV: production
      OPENREPLY_PROVIDER_PROFILE: averion
      OPENREPLY_AUTOMATIONS_ENABLED: "false"
      OPENREPLY_HUMAN_SEND_ENABLED: "false"
    command:
      - sh
      - -c
      - node /config/check-readiness.mjs && npx prisma migrate deploy && npm run start
    volumes:
      - ./check-readiness.mjs:/config/check-readiness.mjs:ro
      - ./ingress-edge.mjs:/config/ingress-edge.mjs:ro
      - ./ingress-policy.json:/config/ingress-policy.json:ro
    networks: [edge, internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    expose: ["3000"]

  worker:
    image: ${OPENREPLY_IMAGE_REF:?set to the digest produced from the release candidate}
    env_file:
      - path: ./secrets.env
        required: false
    environment:
      NODE_ENV: production
      OPENREPLY_PROVIDER_PROFILE: averion
      OPENREPLY_AUTOMATIONS_ENABLED: "false"
      OPENREPLY_HUMAN_SEND_ENABLED: "false"
    command: ["sh", "-c", "node /config/check-readiness.mjs && npm run worker"]
    volumes:
      - ./check-readiness.mjs:/config/check-readiness.mjs:ro
      - ./ingress-edge.mjs:/config/ingress-edge.mjs:ro
      - ./ingress-policy.json:/config/ingress-policy.json:ro
    networks: [internal]
    restart: unless-stopped

  cron:
    image: ${OPENREPLY_IMAGE_REF:?set to the digest produced from the release candidate}
    environment:
      CRON_BASE_URL: http://web:3000
    env_file:
      - path: ./secrets.env
        required: false
    command: ["sh", "-c", "node /config/check-readiness.mjs && exec sh scripts/cron.sh"]
    volumes:
      - ./check-readiness.mjs:/config/check-readiness.mjs:ro
      - ./ingress-edge.mjs:/config/ingress-edge.mjs:ro
      - ./ingress-policy.json:/config/ingress-policy.json:ro
    networks: [internal]
    restart: unless-stopped

networks:
  edge:
    driver: bridge
  internal:
    # Bridge with no published ports. Not docker "internal: true": that mode
    # also blocks outbound calls the webhook and sign-in paths require.
    # This network does not filter outbound hostnames. See EGRESS_ADR.md.
    driver: bridge

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
